name: Deploy a producción (Contabo)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar vía SSH (build en servidor + migraciones + smoke)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            # Do NOT wrap this in `sudo bash -c ...` or `sudo env FOO=1 ...`.
            # The SSH user is `deploy`, and sudoers grants NOPASSWD only for
            # three exact script paths, including this one:
            #   (root) NOPASSWD: /var/www/guiatv/deploy-guiatv.sh,
            #                    /var/www/webtecnoria/infra/deploy-webtecnoria.sh,
            #                    /var/www/talkaris/infra/deploy-chat.sh
            # Anything else asks for a password, there is no TTY, and the step
            # fails before touching the server. Verified 2026-11-05: a wrapped
            # invocation was denied and the deploy never started.
            #
            # Migrations therefore run INSIDE deploy-webtecnoria.sh, which is
            # executed as root: it sources /etc/tecnoria/api.env and runs
            # `npm run migrate:api` BEFORE `systemctl restart tecnoria-api`, so a
            # failed migration aborts the release and leaves the previous API
            # process running.
            sudo /var/www/webtecnoria/infra/deploy-webtecnoria.sh
