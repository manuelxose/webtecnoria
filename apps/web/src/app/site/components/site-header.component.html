<header class="site-header" [class.is-menu-open]="menuOpen">
  <div class="site-container site-header__bar">
    <a class="site-header__brand" routerLink="/" aria-label="Ir a la home de TecnoRia">
      <img
        class="site-header__brand-lockup"
        [src]="logos.lockup.dark.src"
        [alt]="logos.lockup.dark.alt"
        [attr.width]="logos.lockup.dark.width"
        [attr.height]="logos.lockup.dark.height"
      >
    </a>

    <nav class="site-header__desktop-nav" aria-label="Navegación principal">
      <ng-container *ngFor="let item of navigation">
        <a
          *ngIf="item.path !== '/contacto'"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          {{ item.label }}
        </a>
      </ng-container>
    </nav>

    <div class="site-header__desktop-actions">
      <a class="site-header__utility" routerLink="/auth-login">Área privada</a>
      <a class="site-header__utility" [href]="'tel:' + phone">{{ phoneLabel }}</a>
      <a class="button button-primary site-header__primary-action" routerLink="/contacto">
        Solicitar diagnóstico
      </a>
    </div>

    <div class="site-header__mobile-actions">
      <a class="button button-primary site-header__mobile-cta" routerLink="/contacto">
        Diagnóstico
      </a>
      <button
        #menuButton
        class="site-header__toggle"
        type="button"
        [class.is-open]="menuOpen"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-controls]="menuPanelId"
        [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<div *ngIf="menuOpen" class="site-header__backdrop" aria-hidden="true" (click)="closeMenu()"></div>

<aside
  *ngIf="menuOpen"
  class="site-header__drawer"
  [attr.id]="menuPanelId"
  role="dialog"
  aria-modal="true"
  aria-label="Menú principal"
>
  <div class="site-container site-header__drawer-inner">
    <div class="site-header__drawer-head">
      <div class="site-header__drawer-copy">
        <img
          class="site-header__drawer-lockup"
          [src]="logos.lockup.light.src"
          [alt]="logos.lockup.light.alt"
          [attr.width]="logos.lockup.light.width"
          [attr.height]="logos.lockup.light.height"
        >
        <p>
          Rutas rápidas para revisar capacidades, evaluar encaje y abrir una
          conversación técnica con criterio.
        </p>
      </div>

      <button
        #drawerCloseButton
        class="site-header__drawer-close"
        type="button"
        aria-label="Cerrar menu"
        (click)="closeMenu()"
      >
        Cerrar
      </button>
    </div>

    <nav class="site-header__drawer-nav" aria-label="Menú principal">
      <a
        *ngFor="let item of navigation"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        (click)="closeMenuAndFollow()"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="site-header__drawer-actions">
      <a class="button button-primary" routerLink="/contacto" (click)="closeMenuAndFollow()">
        Solicitar diagnóstico
      </a>
      <div class="site-header__drawer-meta">
        <a class="button button-secondary" [href]="'tel:' + phone">{{ phoneLabel }}</a>
        <a class="button button-secondary" [href]="'mailto:' + email">{{ email }}</a>
      </div>
      <a class="site-header__drawer-private" routerLink="/auth-login" (click)="closeMenuAndFollow()">
        Ir al área privada
      </a>
    </div>
  </div>
</aside>
