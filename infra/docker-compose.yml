version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnoria-postgres
    environment:
      POSTGRES_DB: tecnoria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tecnoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tecnoria-api
    env_file:
      - ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: tecnoria-web
    environment:
      PORT: 4000
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  postgres_data:
