services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnoria-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnoria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tecnoria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tecnoria-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/tecnoria}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      COOKIE_NAME: ${COOKIE_NAME:-tecnoria_session}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      UPLOADS_DIR: /app/uploads
      CUTOVER_AUTH: ${CUTOVER_AUTH:-true}
      CUTOVER_BLOG: ${CUTOVER_BLOG:-true}
      CUTOVER_CONTACT: ${CUTOVER_CONTACT:-true}
      CUTOVER_SCRAPER: ${CUTOVER_SCRAPER:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tecnoria.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: tecnoria-web
    environment:
      NODE_ENV: production
      PORT: 4000
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost/api}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: tecnoria-nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_uploads:
