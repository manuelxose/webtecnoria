services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnoria-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnoria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tecnoria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tecnoria-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/tecnoria}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      COOKIE_NAME: ${COOKIE_NAME:-tecnoria_session}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      UPLOADS_DIR: /app/uploads
      CUTOVER_AUTH: ${CUTOVER_AUTH:-true}
      CUTOVER_BLOG: ${CUTOVER_BLOG:-true}
      CUTOVER_CONTACT: ${CUTOVER_CONTACT:-true}
      CUTOVER_SCRAPER: ${CUTOVER_SCRAPER:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tecnoria.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: tecnoria-web
    environment:
      NODE_ENV: production
      PORT: 4000
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost/api}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: tecnoria-nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      chat-api:
        condition: service_healthy
      chat-widget:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  chat-postgres:
    image: pgvector/pgvector:pg16
    container_name: tecnoria-chat-postgres
    environment:
      POSTGRES_DB: ${CHAT_POSTGRES_DB:-tecnoria_chat}
      POSTGRES_USER: ${CHAT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_POSTGRES_USER:-postgres} -d ${CHAT_POSTGRES_DB:-tecnoria_chat}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-api:
    build:
      context: ../../tecnoria-chat-platform
      dockerfile: apps/chat-api/Dockerfile
    container_name: tecnoria-chat-api
    environment:
      NODE_ENV: production
      PORT: 4101
      DATABASE_URL: postgres://${CHAT_POSTGRES_USER:-postgres}:${CHAT_POSTGRES_PASSWORD:-postgres}@chat-postgres:5432/${CHAT_POSTGRES_DB:-tecnoria_chat}
      CORS_ORIGIN: ${CHAT_CORS_ORIGIN:-https://tecnoriasl.com}
      ADMIN_BEARER_TOKEN: ${CHAT_API_ADMIN_BEARER_TOKEN}
      LEAD_WEBHOOK_SHARED_SECRET: ${CHAT_LEAD_WEBHOOK_SHARED_SECRET}
      DEFAULT_LEAD_WEBHOOK_URL: ${CHAT_DEFAULT_LEAD_WEBHOOK_URL:-http://api:3001/api/v1/contact}
    depends_on:
      chat-postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "4101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4101/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  chat-widget:
    build:
      context: ../../tecnoria-chat-platform
      dockerfile: apps/widget/Dockerfile
    container_name: tecnoria-chat-widget
    environment:
      PORT: 4102
      HOST: 0.0.0.0
    depends_on:
      chat-api:
        condition: service_healthy
    expose:
      - "4102"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4102/frame.html >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ingest-worker:
    build:
      context: ../../tecnoria-chat-platform
      dockerfile: apps/ingest-worker/Dockerfile
    container_name: tecnoria-chat-ingest-worker
    environment:
      DATABASE_URL: postgres://${CHAT_POSTGRES_USER:-postgres}:${CHAT_POSTGRES_PASSWORD:-postgres}@chat-postgres:5432/${CHAT_POSTGRES_DB:-tecnoria_chat}
      FETCH_TIMEOUT_MS: ${CHAT_FETCH_TIMEOUT_MS:-15000}
      CRAWLER_USER_AGENT: ${CHAT_CRAWLER_USER_AGENT:-TecnoriaChatIngest/0.1 (+https://tecnoriasl.com)}
    depends_on:
      chat-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
  chat_postgres_data:
