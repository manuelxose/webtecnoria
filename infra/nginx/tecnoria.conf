server {
  listen 80;
  server_name tecnoriasl.com www.tecnoriasl.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.tecnoriasl.com;

  ssl_certificate /var/lib/tecnoria/ssl/origin.crt;
  ssl_certificate_key /var/lib/tecnoria/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  return 301 https://tecnoriasl.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name tecnoriasl.com;

  client_max_body_size 20m;

  ssl_certificate /var/lib/tecnoria/ssl/origin.crt;
  ssl_certificate_key /var/lib/tecnoria/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_http_version 1.1;
  proxy_connect_timeout 60s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  send_timeout 120s;

  location = /health {
    proxy_pass http://127.0.0.1:4300/health;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location = /chat-api {
    return 301 /chat-api/;
  }

  location ^~ /chat-api/ {
    rewrite ^/chat-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4101;
  }

  location = /chat-widget {
    return 301 /chat-widget/;
  }

  location ^~ /chat-widget/ {
    rewrite ^/chat-widget/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4102;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    proxy_pass http://127.0.0.1:4300;
    add_header Cache-Control "no-store";
  }
}
